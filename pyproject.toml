[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minispeed"
version = "0.1.0"
description = "mini DeepSpeed: a minimal GPU AI framework for distributed training (ZeRO 1/2, fp16/bf16, gradient accumulation)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["minispeed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
